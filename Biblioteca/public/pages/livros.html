<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Livros</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main id="content-area">
    <section id="cadastro-livro" class="section">
      <h2>📚 Gestão de Livros</h2>

      <form id="form-livro" class="formulario">
        <input type="hidden" id="livro-id" />

        <div class="input-container">
          <input type="text" id="livro-isbn" class="input" placeholder=" " required />
          <label for="livro-isbn" class="label">ISBN</label>
          <span class="lupa" id="btn-pesq-isbn" title="Pesquisar por ISBN">🔍</span>
          <div class="topline"></div>
          <div class="underline"></div>
        </div>

        <div class="input-container">
          <input type="text" id="livro-titulo" class="input" placeholder=" " required />
          <label for="livro-titulo" class="label">Título</label>
          <span class="lupa" id="btn-pesq-titulo" title="Pesquisar por título">🔍</span>
          <div class="topline"></div>
          <div class="underline"></div>
        </div>

        <div class="input-container">
          <input type="text" id="livro-subtitulo" class="input" placeholder=" " />
          <label for="livro-subtitulo" class="label">Subtítulo</label>
          <div class="topline"></div>
          <div class="underline"></div>
        </div>

        <div class="input-container">
          <input type="text" id="livro-autor" class="input" placeholder=" " />
          <label for="livro-autor" class="label">Autor</label>
          <div class="topline"></div>
          <div class="underline"></div>
        </div>

        <div class="input-container">
          <input type="text" id="livro-genero" class="input" placeholder=" " />
          <label for="livro-genero" class="label">Gênero</label>
          <div class="topline"></div>
          <div class="underline"></div>
        </div>

        <div class="input-container">
          <input type="text" id="livro-editora" class="input" placeholder=" " />
          <label for="livro-editora" class="label">Editora</label>
          <div class="topline"></div>
          <div class="underline"></div>
        </div>

        <div class="input-container">
          <input type="text" id="livro-edicao" class="input" placeholder=" " />
          <label for="livro-edicao" class="label">Edição</label>
          <div class="topline"></div>
          <div class="underline"></div>
        </div>

        <div class="input-container">
          <input type="text" id="livro-ano" class="input" placeholder=" " maxlength="4" />
          <label for="livro-ano" class="label">Ano</label>
          <div class="topline"></div>
          <div class="underline"></div>
        </div>           

        <div class="btn-container">
          <button type="submit" class="btn" id="btn-salvar-livro"><span>Salvar</span></button>
          <button type="button" id="btn-excluir-livro" class="btn"><span>Excluir</span></button>
          <button type="button" id="btn-limpar-livro" class="btn"><span>Limpar</span></button>
        </div>    
        
      </form>
    </section>
  </main>
<!-- MODAL PESQUISA DE LIVRO -->
<div id="modal-pesquisa-titulo" class="modal">
  <div class="modal-card">
    <h3>Livros Encontrados</h3>
    <p class="modal-subtitle">Clique no registro desejado para carregar os dados:</p>
    
    <div id="lista-livros-encontrados" class="modal-lista">
    </div>
    
    <div class="modal-footer">
      <button type="button" id="btn-fechar-modal" class="btn-cancelar">Cancelar</button>
    </div>
  </div>
</div>
  <script src="../script.js"></script>
</body>
</html>
